# TEMPORARY diagnostic workflow for https://github.com/reqnroll/Reqnroll/issues/1128 - remove before merging PR #1129
name: Diag 1128

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  msbuild-path-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-2025-vs2026 ]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Runner image
      shell: pwsh
      run: |
        Write-Output "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
        [System.Environment]::OSVersion.Version
        (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full').Release
        (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled
    - name: Locate MSBuild
      id: msbuild
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -products * -property installationPath
        $bin = Join-Path $vs 'MSBuild\Current\Bin'
        "bin=$bin" >> $env:GITHUB_OUTPUT
        & "$bin\MSBuild.exe" -version -nologo
        Get-ChildItem $bin, "$bin\amd64" -Filter 'MSBuild*.config*' | Select-Object FullName, Length, LastWriteTime | Format-Table -AutoSize | Out-String -Width 300
    - name: Dump MSBuild.exe.config (x86)
      shell: pwsh
      run: Get-Content "${{ steps.msbuild.outputs.bin }}\MSBuild.exe.config" | Select-Object -First 40
    - name: Dump MSBuild.exe.config (amd64)
      shell: pwsh
      run: Get-Content "${{ steps.msbuild.outputs.bin }}\amd64\MSBuild.exe.config" | Select-Object -First 40
    - name: AppContext switches in configs
      shell: pwsh
      run: |
        foreach ($f in "${{ steps.msbuild.outputs.bin }}\MSBuild.exe.config", "${{ steps.msbuild.outputs.bin }}\amd64\MSBuild.exe.config") {
          Write-Output "== $f"
          Select-String -Path $f -Pattern 'supportedRuntime|AppContextSwitchOverrides' | ForEach-Object { $_.Line.Trim() }
        }
    - name: Build probe task
      shell: pwsh
      run: |
        # copy outside the repo so that the repo's Directory.Build.props is not applied
        Copy-Item -Recurse .github\diag-1128 "$env:RUNNER_TEMP\probe"
        dotnet build "$env:RUNNER_TEMP\probe\ProbeTask\ProbeTask.csproj" -c Release -nologo -v:m
    - name: Run probe with MSBuild (x86)
      shell: pwsh
      run: |
        & "${{ steps.msbuild.outputs.bin }}\MSBuild.exe" "$env:RUNNER_TEMP\probe\probe.proj" -nologo -nodeReuse:false -v:m "-bl:$env:RUNNER_TEMP\binlogs\probe-x86.binlog"
    - name: Run probe with MSBuild (amd64)
      shell: pwsh
      run: |
        & "${{ steps.msbuild.outputs.bin }}\amd64\MSBuild.exe" "$env:RUNNER_TEMP\probe\probe.proj" -nologo -nodeReuse:false -v:m "-bl:$env:RUNNER_TEMP\binlogs\probe-amd64.binlog"
    - name: Machine info (.NET Framework, hotfixes, AppContext registry, env)
      shell: pwsh
      run: |
        Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' | ForEach-Object { "OS: $($_.ProductName) $($_.DisplayVersion) build $($_.CurrentBuild).$($_.UBR)" }
        "NDP release: " + (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full').Release
        "mscorlib x86: " + (Get-Item C:\Windows\Microsoft.NET\Framework\v4.0.30319\mscorlib.dll).VersionInfo.FileVersion
        "mscorlib x64: " + (Get-Item C:\Windows\Microsoft.NET\Framework64\v4.0.30319\mscorlib.dll).VersionInfo.FileVersion
        "LongPathsEnabled: " + (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem').LongPathsEnabled
        foreach ($k in 'HKLM:\SOFTWARE\Microsoft\.NETFramework\AppContext', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\.NETFramework\AppContext', 'HKCU:\SOFTWARE\Microsoft\.NETFramework\AppContext') {
          "== $k exists=$(Test-Path $k)"
          Get-ItemProperty $k -ErrorAction SilentlyContinue | Select-Object * -ExcludeProperty PS* | Format-List | Out-String -Width 300
        }
        "== .NETFramework keys (64/32 bit)"
        Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\.NETFramework', 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\.NETFramework' -ErrorAction SilentlyContinue | Select-Object * -ExcludeProperty PS* | Format-List | Out-String -Width 300
        "== env"
        Get-ChildItem env: | Where-Object Name -match '^(COMPlus_|DOTNET_|MSBUILD)' | Format-Table -AutoSize | Out-String -Width 300
        "== hotfixes"
        Get-HotFix | Sort-Object InstalledOn | Format-Table HotFixID, Description, InstalledOn -AutoSize | Out-String -Width 200
    - name: Standalone x86 probe app (own / MSBuild merged / MSBuild template config)
      shell: pwsh
      run: |
        $bin = "${{ steps.msbuild.outputs.bin }}"
        dotnet build "$env:RUNNER_TEMP\probe\ProbeApp\ProbeApp.csproj" -c Release -nologo -v:q
        $app = "$env:RUNNER_TEMP\probe\ProbeApp\bin\Release\net472"
        & "$app\ProbeApp.exe" app-own-config
        foreach ($v in @(@('app-merged-config', "$bin\MSBuild.exe.config"), @('app-template-config', "$bin\MSBuild.exe.config.template"))) {
          $dir = "$env:RUNNER_TEMP\probe\$($v[0])"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "$app\ProbeApp.exe" $dir
          Copy-Item $v[1] "$dir\ProbeApp.exe.config"
          & "$dir\ProbeApp.exe" $v[0]
        }
    - name: Config swap - x86 MSBuild with the template config
      shell: pwsh
      run: |
        $bin = "${{ steps.msbuild.outputs.bin }}"
        Copy-Item "$bin\MSBuild.exe.config" "$env:RUNNER_TEMP\MSBuild.exe.config.merged"
        try {
          Copy-Item "$bin\MSBuild.exe.config.template" "$bin\MSBuild.exe.config" -Force
          & "$bin\MSBuild.exe" "$env:RUNNER_TEMP\probe\probe.proj" -nologo -nodeReuse:false -v:m
        }
        finally {
          Copy-Item "$env:RUNNER_TEMP\MSBuild.exe.config.merged" "$bin\MSBuild.exe.config" -Force
        }
    - name: Diff merged MSBuild.exe.config against template
      shell: pwsh
      run: |
        $bin = "${{ steps.msbuild.outputs.bin }}"
        $out = "$env:RUNNER_TEMP\configs"
        New-Item -ItemType Directory -Force "$out\x86", "$out\amd64" | Out-Null
        Copy-Item "$bin\MSBuild.exe.config*" "$out\x86\"
        Copy-Item "$bin\amd64\MSBuild.exe.config*" "$out\amd64\"
        Copy-Item "$bin\..\..\..\Common7\IDE\devenv.exe.config*" $out -ErrorAction SilentlyContinue
        foreach ($a in 'x86', 'amd64') {
          Write-Output "########## $a : template -> installed config"
          git diff --no-index --no-color "$out\$a\MSBuild.exe.config.template" "$out\$a\MSBuild.exe.config"
        }
        exit 0
    - name: Build IDE probe solution with devenv
      shell: pwsh
      run: |
        $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -products * -property installationPath
        dotnet restore "$env:RUNNER_TEMP\probe\ide\ProbeIde.sln" -nologo -v:m
        & "$vs\Common7\IDE\devenv.com" "$env:RUNNER_TEMP\probe\ide\ProbeIde.sln" /Build Debug
    - name: Upload binlogs and configs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: diag-1128-${{ matrix.os }}
        path: |
          ${{ runner.temp }}/binlogs/
          ${{ runner.temp }}/configs/
